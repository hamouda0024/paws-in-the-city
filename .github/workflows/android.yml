name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installed explicitly (not via a third-party action) so the SDK layout and
      # package set are exactly what the Gradle build expects.
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the Android shell
        run: npx cap sync android

      # Sign with the repository's upload key when the secrets exist,
      # otherwise fall back to an installable debug build.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/urban-stray.keystore
            {
              echo "storeFile=urban-stray.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-urbanstray}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --console=plain --no-daemon
          else
            ./gradlew assembleDebug --console=plain --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/urban-stray.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/urban-stray.apk
          fi
          ls -lh dist/urban-stray.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: urban-stray-apk
          path: dist/urban-stray.apk
          if-no-files-found: error

      # Pushing a tag such as v1.0.1 publishes a GitHub Release with the APK attached,
      # which is what the README download button points at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/urban-stray.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Creates the official Release for the version in www/version.json once per
  # version, straight from a push to main. The tag, notes and the committed
  # signed APK all come from the repository, so a release never depends on
  # anyone's local credentials. Existing releases are left untouched.
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release the version in www/version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('www/version.json'))['version'])")
          NOTES=$(python3 -c "import json;print(json.load(open('www/version.json')).get('notes',''))")
          TAG="v$VERSION"
          APK="releases/urban-stray-$TAG.apk"

          if [ ! -f "$APK" ]; then
            echo "No committed APK at $APK — build and commit it first."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          # Prefer the checksum committed next to the APK; fall back to hashing it.
          if [ -f "$APK.sha256" ]; then
            HASH=$(cut -d' ' -f1 "$APK.sha256")
          else
            HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          fi

          {
            echo "## What's new in $TAG"
            echo
            echo "$NOTES"
            echo
            echo "**Signed release build** · Android 7.0+ (API 24) · landscape · works offline, no ads, no accounts."
            echo
            echo "APK size: $(du -h "$APK" | cut -f1) · SHA-256: \`$HASH\`"
            echo
            echo "Verify after downloading: \`sha256sum urban-stray-$TAG.apk\`"
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md"
          } > /tmp/release-notes.md

          ASSETS=("$APK#urban-stray-$TAG.apk")
          if [ -f "$APK.sha256" ]; then
            ASSETS+=("$APK.sha256#urban-stray-$TAG.apk.sha256")
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Urban Stray $TAG" \
            --notes-file /tmp/release-notes.md

          echo "Published $TAG"
