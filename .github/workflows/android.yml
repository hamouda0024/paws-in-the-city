name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the Android shell
        run: npx cap sync android

      # Sign with the repository's upload key when the secrets exist,
      # otherwise fall back to an installable debug build.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/urban-stray.keystore
            {
              echo "storeFile=urban-stray.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-urbanstray}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        working-directory: android
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/urban-stray.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/urban-stray.apk
          fi
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: urban-stray-apk
          path: dist/urban-stray.apk
          if-no-files-found: error

      # Pushing a tag such as v1.0.1 publishes a GitHub Release with the APK attached,
      # which is what the README download button points at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/urban-stray.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
