name: Bug report
description: Something in Urban Stray is broken or behaves oddly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the stray. Please include enough detail to reproduce.
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 6a, Android 14 (or Desktop Chrome 130)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: e.g. 1.0.0 (from the About screen or the APK filename)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually occurred?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a run
        2. Jump on the awning at the second building
        3. ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Controls / movement
        - Survival stats or balance
        - Cars / dogs / hazards
        - Scavenging or sleeping
        - Rendering / art
        - Audio
        - Menus / saved progress
        - Build / APK
        - Other
