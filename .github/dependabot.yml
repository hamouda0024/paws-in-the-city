version: 2

updates:
  # Web shell / Capacitor toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
    ignore:
      # Capacitor's Android platform and CLI must move together with the Gradle
      # plugin versions; those are bumped deliberately, not automatically.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]

  # Android shell
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(android-deps)"
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  # Keep the CI actions themselves current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
